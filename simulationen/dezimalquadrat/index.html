<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Dezimalzahlen am Quadrat</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="buehne">
    <canvas id="flaeche" aria-label="Quadrate mit Einteilung in Zehntel, Hundertstel, Tausendstel und Zehntausendstel"></canvas>
    <canvas id="strahl" hidden aria-label="Zahlenstrahl von −3 bis 3 mit Strichen für Ganze, Zehntel, Hundertstel und Tausendstel"></canvas>

    <div class="header">
      <h1>Dezimalzahlen am Quadrat</h1>
      <p id="untertitel">Ein Quadrat ist ein Ganzes.</p>
    </div>

    <div class="zoomleiste">
      <button id="zoomIn" type="button" aria-label="Hineinzoomen">+</button>
      <button id="zoomOut" type="button" aria-label="Herauszoomen">−</button>
      <button id="uebersichtBtn" type="button">Übersicht</button>
      <button id="lupeBtn" type="button" aria-pressed="false">🔍 Lupe</button>
    </div>

    <p class="hint" id="hinweis"></p>
    <!-- Am Zahlenstrahl: Zahl und (per Knopf) Stellenwerttafel direkt über dem Strahl -->
    <div class="obenLeiste" id="obenLeiste" hidden>
      <div class="zahl zahlOben" id="zahlOben" title="Verschieben: ziehen · ↺ bzw. Doppelklick: zurück an den Platz">
        <span id="zahlObenText" aria-hidden="true"></span>
        <button id="zahlZurueck" class="zurueck" type="button" hidden aria-label="Zahlfeld zurück an seinen Platz">↺</button>
      </div>
      <div class="tafelOben" id="tafelOben" hidden></div>
    </div>
  </div>

  <aside class="panel">
    <section>
      <h2>Darstellung</h2>
      <div class="segmented" role="group" aria-label="Darstellung">
        <button type="button" data-darstellung="quadrat">Quadrat</button>
        <button type="button" data-darstellung="strahl">Zahlenstrahl</button>
      </div>
    </section>

    <section id="skalaBereich" hidden>
      <h2>Einteilung des Zahlenstrahls</h2>
      <div class="stufen" id="skalaStufen" aria-live="polite"></div>
      <div class="segmented">
        <button id="groeberBtn" type="button">− gröber</button>
        <button id="feinerBtn" type="button">feiner +</button>
      </div>
      <button id="antippenBtn" class="umschalter unten" type="button" aria-pressed="false">Zahl durch Antippen markieren</button>
      <button id="streckeBtn" class="umschalter unten" type="button" aria-pressed="false">Zahl als Strecke ab 0 zeigen</button>
    </section>

    <section>
      <h2>Zahl</h2>
      <p class="zahl" id="zahlAnzeige" aria-live="polite"></p>
      <p class="zerlegung" id="zerlegung"></p>
      <form id="eingabeForm" class="eingabe">
        <input id="eingabe" type="text" autocomplete="off" placeholder="z. B. 0,347 · 3/4" aria-label="Zahl oder Bruch eingeben" />
        <button type="submit">Darstellen</button>
      </form>
      <p class="fehler" id="fehler" role="alert"></p>
      <button id="zeigenBtn" class="aufdecken" type="button" hidden>Auf dem Zahlenstrahl markieren</button>
      <button id="aufKnopfBtn" class="umschalter" type="button" aria-pressed="false" hidden>Eingabe erst auf Knopfdruck markieren</button>
      <button id="nullBtn" type="button">Zurücksetzen (0)</button>
    </section>

    <section id="tafelPlatz">
      <h2>Stellenwerttafel</h2>
      <button id="tafelBtn" class="umschalter" type="button" aria-pressed="false">Stellenwerttafel einblenden</button>
      <div id="tafelBereich" hidden>
        <div class="tafel" id="stellenwerttafel"></div>
        <p class="status" id="tafelHinweis"></p>
      </div>
    </section>

    <section id="quadratBereich">
      <h2>Quadrate</h2>
      <div class="segmented" role="group" aria-label="Anzahl der Quadrate">
        <button type="button" data-quadrate="1">1</button>
        <button type="button" data-quadrate="2">2</button>
        <button type="button" data-quadrate="3">3</button>
      </div>
      <h2 class="unter">Einteilung</h2>
      <div class="segmented" role="group" aria-label="Einteilung">
        <button type="button" data-einteilung="rechtecke">Rechtecke (5 × 2)</button>
        <button type="button" data-einteilung="streifen">Streifen</button>
      </div>
    </section>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
