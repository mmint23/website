    <text x="1100" y="448" font-size="26" fill="#1d2733" text-anchor="middle">φ = 270°</text>
  </g>
  <!-- φ = 360° -->
  <g>
    <rect x="1285" y="50" width="190" height="42" rx="4" fill="#e53935"/>
    <text x="1380" y="80" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <rect x="1285" y="368" width="190" height="42" rx="4" fill="#43a047"/>
    <text x="1380" y="398" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <line x1="1318" y1="100" x2="1318" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="1380" y1="100" x2="1380" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="1442" y1="100" x2="1442" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="1292" y1="230" x2="1468" y2="230" stroke="#b86b2e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1380" cy="230" r="7" fill="#78858f"/>
    <circle cx="1292" cy="230" r="18" fill="#b86b2e"/>
    <text x="1292" y="237" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <circle cx="1468" cy="230" r="18" fill="#ffffff" stroke="#b86b2e" stroke-width="4"/>
    <text x="1468" y="237" font-size="20" font-weight="700" fill="#b86b2e" text-anchor="middle">B</text>
    <text x="1380" y="448" font-size="26" fill="#1d2733" text-anchor="middle">φ = 360°</text>
  </g>
  <!-- U-t-Diagramm (leer): Hilfslinien unter den Bildern, Achsen -->
  <line x1="260" y1="466" x2="260" y2="945" stroke="#9aa7b4" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="540" y1="466" x2="540" y2="945" stroke="#9aa7b4" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="820" y1="466" x2="820" y2="945" stroke="#9aa7b4" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="1100" y1="466" x2="1100" y2="945" stroke="#9aa7b4" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="1380" y1="466" x2="1380" y2="945" stroke="#9aa7b4" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="260" y1="575" x2="1510" y2="575" stroke="#d5dce3" stroke-width="2" stroke-dasharray="3 9"/>
  <line x1="260" y1="895" x2="1510" y2="895" stroke="#d5dce3" stroke-width="2" stroke-dasharray="3 9"/>
  <line x1="260" y1="955" x2="260" y2="530" stroke="#1d2733" stroke-width="3" marker-end="url(#spitze)"/>
  <line x1="240" y1="735" x2="1540" y2="735" stroke="#1d2733" stroke-width="3" marker-end="url(#spitze)"/>
  <text x="238" y="552" font-size="30" font-style="italic" fill="#1d2733" text-anchor="end">U</text>
  <text x="1544" y="775" font-size="30" font-style="italic" fill="#1d2733" text-anchor="end">t</text>
  <text x="238" y="745" font-size="24" fill="#1d2733" text-anchor="end">0</text>
  <line x1="260" y1="725" x2="260" y2="745" stroke="#1d2733" stroke-width="3"/>
  <text x="260" y="980" font-size="26" fill="#1d2733" text-anchor="middle">t = 0</text>
  <line x1="540" y1="725" x2="540" y2="745" stroke="#1d2733" stroke-width="3"/>
  <text x="540" y="980" font-size="26" fill="#1d2733" text-anchor="middle">T/4</text>
  <line x1="820" y1="725" x2="820" y2="745" stroke="#1d2733" stroke-width="3"/>
  <text x="820" y="980" font-size="26" fill="#1d2733" text-anchor="middle">T/2</text>
  <line x1="1100" y1="725" x2="1100" y2="745" stroke="#1d2733" stroke-width="3"/>
  <text x="1100" y="980" font-size="26" fill="#1d2733" text-anchor="middle">3T/4</text>
  <line x1="1380" y1="725" x2="1380" y2="745" stroke="#1d2733" stroke-width="3"/>
  <text x="1380" y="980" font-size="26" fill="#1d2733" text-anchor="middle">T</text>
</svg>
