<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Tafelbild Generator: Leiterschleife in fünf Stellungen (Blick entlang der Welle von rechts, Drehung gegen den
       Uhrzeigersinn wie in der Simulation, Nordpol oben) und darunter ein leeres U-t-Diagramm. Die Zeitmarken stehen
       genau unter den Bildern. Koordinaten der Abgaben beziehen sich auf dieses Bild – nach dem ersten Teilen nicht
       mehr verschieben. -->
  <defs>
    <marker id="spitze" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/>
    </marker>
    <marker id="feld" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="dreh" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5866"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="40" y="34" font-size="22" fill="#4a5866">Leiterschleife – Blick entlang der Welle (von rechts)</text>
  <!-- φ = 0° -->
  <g>
    <rect x="165" y="50" width="190" height="42" rx="4" fill="#e53935"/>
    <text x="260" y="80" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <rect x="165" y="368" width="190" height="42" rx="4" fill="#43a047"/>
    <text x="260" y="398" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <line x1="198" y1="100" x2="198" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="260" y1="100" x2="260" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="322" y1="100" x2="322" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="172" y1="230" x2="348" y2="230" stroke="#b86b2e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="260" cy="230" r="7" fill="#78858f"/>
    <circle cx="172" cy="230" r="18" fill="#b86b2e"/>
    <text x="172" y="237" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <circle cx="348" cy="230" r="18" fill="#ffffff" stroke="#b86b2e" stroke-width="4"/>
    <text x="348" y="237" font-size="20" font-weight="700" fill="#b86b2e" text-anchor="middle">B</text>
    <path d="M138.7,242.8 A122,122 0 0 0 178.4,320.7" fill="none" stroke="#4a5866" stroke-width="3" marker-end="url(#dreh)"/>
    <text x="110" y="358" font-size="18" fill="#4a5866" text-anchor="middle">Drehsinn</text>
    <text x="260" y="448" font-size="26" fill="#1d2733" text-anchor="middle">φ = 0°</text>
  </g>
  <!-- φ = 90° -->
  <g>
    <rect x="445" y="50" width="190" height="42" rx="4" fill="#e53935"/>
    <text x="540" y="80" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <rect x="445" y="368" width="190" height="42" rx="4" fill="#43a047"/>
    <text x="540" y="398" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <line x1="478" y1="100" x2="478" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="540" y1="100" x2="540" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="602" y1="100" x2="602" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="540" y1="318" x2="540" y2="142" stroke="#b86b2e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="540" cy="230" r="7" fill="#78858f"/>
    <circle cx="540" cy="318" r="18" fill="#b86b2e"/>
    <text x="540" y="325" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <circle cx="540" cy="142" r="18" fill="#ffffff" stroke="#b86b2e" stroke-width="4"/>
    <text x="540" y="149" font-size="20" font-weight="700" fill="#b86b2e" text-anchor="middle">B</text>
    <text x="540" y="448" font-size="26" fill="#1d2733" text-anchor="middle">φ = 90°</text>
  </g>
  <!-- φ = 180° -->
  <g>
    <rect x="725" y="50" width="190" height="42" rx="4" fill="#e53935"/>
    <text x="820" y="80" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <rect x="725" y="368" width="190" height="42" rx="4" fill="#43a047"/>
    <text x="820" y="398" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <line x1="758" y1="100" x2="758" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="820" y1="100" x2="820" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="882" y1="100" x2="882" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="908" y1="230" x2="732" y2="230" stroke="#b86b2e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="820" cy="230" r="7" fill="#78858f"/>
    <circle cx="908" cy="230" r="18" fill="#b86b2e"/>
    <text x="908" y="237" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <circle cx="732" cy="230" r="18" fill="#ffffff" stroke="#b86b2e" stroke-width="4"/>
    <text x="732" y="237" font-size="20" font-weight="700" fill="#b86b2e" text-anchor="middle">B</text>
    <text x="820" y="448" font-size="26" fill="#1d2733" text-anchor="middle">φ = 180°</text>
  </g>
  <!-- φ = 270° -->
  <g>
    <rect x="1005" y="50" width="190" height="42" rx="4" fill="#e53935"/>
    <text x="1100" y="80" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">N</text>
    <rect x="1005" y="368" width="190" height="42" rx="4" fill="#43a047"/>
    <text x="1100" y="398" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
    <line x1="1038" y1="100" x2="1038" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="1100" y1="100" x2="1100" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="1162" y1="100" x2="1162" y2="358" stroke="#1565c0" stroke-width="2.5" stroke-opacity="0.35" marker-end="url(#feld)"/>
    <line x1="1100" y1="142" x2="1100" y2="318" stroke="#b86b2e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="1100" cy="230" r="7" fill="#78858f"/>
    <circle cx="1100" cy="142" r="18" fill="#b86b2e"/>
    <text x="1100" y="149" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <circle cx="1100" cy="318" r="18" fill="#ffffff" stroke="#b86b2e" stroke-width="4"/>
